<!-- Task 117: the Rah logo. "Rah" (راه) means "the road" - the mark is an
     accent tile with a white geometric R whose leg kicks forward like a
     road bending out of frame. The PNG icon set in public/icons renders
     from this exact geometry. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rah-logo-g" x1="6" y1="2" x2="26" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4e8cff"/>
      <stop offset="0.55" stop-color="#2f62c4"/>
      <stop offset="1" stop-color="#24509f"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#rah-logo-g)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="none" stroke="rgba(255,255,255,0.22)"/>
  <rect x="2" y="2" width="28" height="12" rx="6" fill="#ffffff" opacity="0.08"/>
  <path fill-rule="evenodd" clip-rule="evenodd"
    d="M9.2 23.2V8.8h7.3c3.15 0 5.25 1.9 5.25 4.7 0 1.95-1.05 3.5-2.75 4.2l3.35 5.5h-3.95l-2.85-4.9h-2.75v4.9H9.2zm3.6-7.9h3.45c1.55 0 2.5-.85 2.5-2.15s-.95-2.15-2.5-2.15H12.8v4.3z"
    fill="#ffffff"/>
